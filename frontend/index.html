<!doctype html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LAZPLAY OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="preload" href="/material-symbols-outlined.ttf" as="font" type="font/ttf" crossorigin="anonymous">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script id="theme-logic">
        const updateThemeColors = (primaryHex, secondaryHex) => {
            const root = document.documentElement;
            const uiMode = localStorage.getItem('lazplay-ui-mode') || 'standard';
            
            let p, s;
            if (uiMode === 'standard') {
                p = '#2ea44f'; // standard green color
                s = '#47c96d';
            } else {
                p = primaryHex || localStorage.getItem('lazplay-theme-color') || '#39ff14';
                s = secondaryHex || localStorage.getItem('lazplay-secondary-color') || '#ffabf3';
            }

            const hexToRgb = (hex) => {
                const r = parseInt(hex.slice(1, 3), 16);
                const g = parseInt(hex.slice(3, 5), 16);
                const b = parseInt(hex.slice(5, 7), 16);
                return { r, g, b, str: `${r}, ${g}, ${b}` };
            };

            const pRgb = hexToRgb(p);
            root.style.setProperty('--primary-rgb', pRgb.str);
            root.style.setProperty('--primary', p);
            root.style.setProperty('--primary-fixed', p);
            root.style.setProperty('--primary-container', `rgba(${pRgb.r}, ${pRgb.g}, ${pRgb.b}, 0.3)`);
            root.style.setProperty('--on-primary-container', '#ffffff'); // Lighter text
            root.style.setProperty('--glow-primary', `rgba(${pRgb.r}, ${pRgb.g}, ${pRgb.b}, 0.5)`);
            root.style.setProperty('--primary-fixed-dim', `rgba(${pRgb.r}, ${pRgb.g}, ${pRgb.b}, 0.8)`);

            const sRgb = hexToRgb(s);
            root.style.setProperty('--secondary-rgb', sRgb.str);
            root.style.setProperty('--secondary', s);
            root.style.setProperty('--secondary-fixed', s);
            root.style.setProperty('--secondary-container', `rgba(${sRgb.r}, ${sRgb.g}, ${sRgb.b}, 0.3)`);
            root.style.setProperty('--on-secondary-container', '#ffffff'); // Lighter text
            root.style.setProperty('--glow-secondary', `rgba(${sRgb.r}, ${sRgb.g}, ${sRgb.b}, 0.5)`);
            
            // Global surface text (overridden for standard light mode in css)
            if (uiMode === 'cyber') {
                root.style.setProperty('--on-surface', '#ffffff');
                root.style.setProperty('--on-background', '#ffffff');
            }
        };

        // Initial application of classes to avoid FOUC
        const uiMode = localStorage.getItem('lazplay-ui-mode') || 'standard';
        const colorTheme = localStorage.getItem('lazplay-color-theme') || 'system';
        const root = document.documentElement;

        if (uiMode === 'standard') {
            root.classList.add('ui-standard');
            root.classList.remove('ui-cyber');
            
            let isDark = true;
            if (colorTheme === 'light') {
                isDark = false;
            } else if (colorTheme === 'system') {
                isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            }
            
            if (isDark) {
                root.classList.add('dark');
                root.classList.remove('light');
            } else {
                root.classList.add('light');
                root.classList.remove('dark');
            }
        } else {
            root.classList.add('ui-cyber');
            root.classList.remove('ui-standard');
            root.classList.add('dark');
            root.classList.remove('light');
        }

        // Initial apply
        updateThemeColors();

        window.setThemeColor = (color) => {
            localStorage.setItem('lazplay-theme-color', color);
            updateThemeColors(color, null);
        };

        window.setSecondaryColor = (color) => {
            localStorage.setItem('lazplay-secondary-color', color);
            updateThemeColors(null, color);
        };

        // Hook up custom theme change notifier
        window.notifyThemeChange = () => {
            updateThemeColors();
        };
    </script>
    <style>
        .scanlines {
            background: linear-gradient(to bottom,
                    rgba(255, 255, 255, 0),
                    rgba(255, 255, 255, 0) 50%,
                    rgba(0, 0, 0, 0.05) 50%,
                    rgba(0, 0, 0, 0.05));
            background-size: 100% 4px;
            pointer-events: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            opacity: 0.2;
        }

        .grid-glow-bg {
            background-image: 
                linear-gradient(rgba(var(--primary-rgb), 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(var(--primary-rgb), 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center center;
        }

        .retro-border {
            box-shadow: -2px -2px 0 0 var(--primary), 2px 2px 0 0 #000;
        }

        .retro-border-hover:hover {
            box-shadow: 0 0 15px var(--glow-primary), -2px -2px 0 0 var(--primary);
        }

        .neon-glow {
            box-shadow: 0 0 20px var(--glow-primary);
        }

        .glow-text-primary {
            text-shadow: 0 0 10px var(--glow-primary), 0 0 20px rgba(var(--primary-rgb), 0.3);
        }

        .glow-text-secondary {
            text-shadow: 0 0 10px var(--glow-secondary), 0 0 20px rgba(var(--secondary-rgb), 0.3);
        }

        .cyber-btn {
            position: relative;
            background: rgba(var(--primary-rgb), 0.4); /* Lighter/Brighter base */
            border: 2px solid var(--primary);
            color: #ffffff; /* Light text */
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-shadow: 0 0 5px var(--glow-primary);
            box-shadow: inset 0 0 15px rgba(var(--primary-rgb), 0.2);
            text-transform: uppercase;
            font-weight: bold;
        }
        
        .cyber-btn:hover {
            background: rgba(var(--primary-rgb), 0.2); /* Slightly darker/more transparent on hover */
            color: #ffffff;
            box-shadow: 0 0 25px var(--glow-primary), inset 0 0 10px rgba(0,0,0,0.3);
            transform: translateY(-1px);
        }

        .cyber-btn:active {
            transform: translateY(1px);
            background: rgba(var(--primary-rgb), 0.1);
        }

        /* Autofill Override to prevent white background */
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #131313 inset !important;
            -webkit-text-fill-color: #e5e2e1 !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>

<body
    class="bg-background text-on-background font-body-md min-h-screen relative overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
