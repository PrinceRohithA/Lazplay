<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LAZPLAY OS</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script id="tailwind-config">
        const updateThemeColors = (hex) => {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);

            const root = document.documentElement;
            
            // Primary Container (The main neon color)
            root.style.setProperty('--primary-container', hex);
            root.style.setProperty('--primary-container-rgb', `${r}, ${g}, ${b}`);
            
            // On Primary Container (Dark version for text on neon)
            const onPrimaryContainer = `rgb(${Math.floor(r * 0.3)}, ${Math.floor(g * 0.3)}, ${Math.floor(b * 0.3)})`;
            root.style.setProperty('--on-primary-container', onPrimaryContainer);

            // Primary (Light version)
            const primary = `rgb(${Math.min(255, r + 200)}, ${Math.min(255, g + 200)}, ${Math.min(255, b + 200)})`;
            root.style.setProperty('--primary', primary);

            // On Primary (Very dark version)
            const onPrimary = `rgb(${Math.floor(r * 0.1)}, ${Math.floor(g * 0.1)}, ${Math.floor(b * 0.1)})`;
            root.style.setProperty('--on-primary', onPrimary);

            // Surface Tint
            root.style.setProperty('--surface-tint', hex);

            // Primary Fixed & Fixed Dim
            root.style.setProperty('--primary-fixed', hex);
            root.style.setProperty('--primary-fixed-dim', hex);
        };

        // Initialize from localStorage
        const savedColor = localStorage.getItem('lazplay-theme-color') || '#39ff14';
        document.documentElement.style.setProperty('--primary-container', savedColor);
        // We'll call updateThemeColors in a bit to set the rest, but let's define the config first

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#0e0e0e",
                        "on-secondary": "#5b005b",
                        "on-secondary-fixed-variant": "#810081",
                        "background": "#131313",
                        "surface": "#131313",
                        "on-tertiary-container": "#006d6d",
                        "secondary-fixed-dim": "#ffabf3",
                        "on-tertiary-fixed": "#002020",
                        "error": "#ffb4ab",
                        "surface-bright": "#3a3939",
                        "primary-fixed": "var(--primary-fixed)",
                        "surface-dim": "#131313",
                        "on-tertiary-fixed-variant": "#004f4f",
                        "inverse-surface": "#e5e2e1",
                        "surface-container-high": "#2a2a2a",
                        "surface-container-highest": "#353534",
                        "on-background": "#e5e2e1",
                        "on-secondary-fixed": "#380038",
                        "outline": "var(--primary-container)", // Use primary for outline too
                        "error-container": "#93000a",
                        "inverse-on-surface": "#313030",
                        "on-surface": "#e5e2e1",
                        "on-primary-container": "var(--on-primary-container)",
                        "surface-variant": "#353534",
                        "outline-variant": "var(--on-primary-container)", // Dimmer outline
                        "tertiary-fixed-dim": "#00dddd",
                        "on-primary-fixed": "var(--on-primary)",
                        "secondary-fixed": "#ffd7f5",
                        "on-primary-fixed-variant": "var(--on-primary-container)",
                        "primary-container": "var(--primary-container)",
                        "surface-container": "#201f1f",
                        "secondary-container": "#fe00fe",
                        "surface-container-low": "#1c1b1b",
                        "on-tertiary": "#003737",
                        "secondary": "#ffabf3",
                        "on-primary": "var(--on-primary)",
                        "tertiary-container": "#00f6f6",
                        "on-error": "#690005",
                        "tertiary-fixed": "#00fbfb",
                        "on-surface-variant": "#baccb0",
                        "inverse-primary": "var(--on-primary-container)",
                        "surface-tint": "var(--surface-tint)",
                        "primary": "var(--primary)",
                        "primary-fixed-dim": "var(--primary-fixed-dim)",
                        "tertiary": "#e6fffe",
                        "on-secondary-container": "#500050",
                        "on-error-container": "#ffdad6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "unit": "4px",
                        "margin": "24px",
                        "container-max": "1440px"
                    },
                    "fontFamily": {
                        "body-md": ["Space Grotesk"],
                        "label-mono": ["Space Grotesk"],
                        "headline-xl": ["Space Grotesk"],
                        "headline-md": ["Space Grotesk"],
                        "body-lg": ["Space Grotesk"],
                        "headline-lg": ["Space Grotesk"]
                    },
                    "fontSize": {
                        "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "label-mono": ["12px", {"lineHeight": "1.0", "letterSpacing": "0.1em", "fontWeight": "600"}],
                        "headline-xl": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-md": ["24px", {"lineHeight": "1.2", "fontWeight": "600"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "700"}]
                    }
                }
            }
        };
        
        // Apply saved color immediately
        updateThemeColors(savedColor);

        // Expose to window for React to use
        window.setThemeColor = (color) => {
            localStorage.setItem('lazplay-theme-color', color);
            updateThemeColors(color);
        };
    </script>
    <style>
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
        }
        .retro-border {
            box-shadow: -2px -2px 0 0 var(--on-primary-container), 2px 2px 0 0 #131313;
        }
        .retro-border-hover:hover {
            box-shadow: -2px -2px 0 0 var(--primary-container), 2px 2px 0 0 var(--on-primary-container);
        }
        .neon-glow {
            box-shadow: 0 0 10px var(--primary-container);
        }
    </style>
  </head>
  <body class="bg-background text-on-background font-body-md min-h-screen relative overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
