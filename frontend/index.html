<!doctype html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LAZPLAY OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script id="theme-logic">
        const updateThemeColors = (primaryHex, secondaryHex) => {
            const root = document.documentElement;

            if (primaryHex) {
                const r = parseInt(primaryHex.slice(1, 3), 16);
                const g = parseInt(primaryHex.slice(3, 5), 16);
                const b = parseInt(primaryHex.slice(5, 7), 16);

                root.style.setProperty('--primary-container', primaryHex);
                root.style.setProperty('--primary-container-rgb', `${r}, ${g}, ${b}`);

                const onPrimaryContainer = `rgb(${Math.floor(r * 0.3)}, ${Math.floor(g * 0.3)}, ${Math.floor(b * 0.3)})`;
                root.style.setProperty('--on-primary-container', onPrimaryContainer);

                const primary = `rgb(${Math.min(255, r + 200)}, ${Math.min(255, g + 200)}, ${Math.min(255, b + 200)})`;
                root.style.setProperty('--primary', primary);

                const onPrimary = `rgb(${Math.floor(r * 0.1)}, ${Math.floor(g * 0.1)}, ${Math.floor(b * 0.1)})`;
                root.style.setProperty('--on-primary', onPrimary);

                root.style.setProperty('--surface-tint', primaryHex);
                root.style.setProperty('--primary-fixed', primaryHex);
                root.style.setProperty('--primary-fixed-dim', primaryHex);
            }

            if (secondaryHex) {
                const r = parseInt(secondaryHex.slice(1, 3), 16);
                const g = parseInt(secondaryHex.slice(3, 5), 16);
                const b = parseInt(secondaryHex.slice(5, 7), 16);

                root.style.setProperty('--secondary', secondaryHex);
                // Secondary Container: Dark and desaturated version
                root.style.setProperty('--secondary-container', `rgb(${Math.floor(r * 0.4)}, ${Math.floor(g * 0.1)}, ${Math.floor(b * 0.4)})`);
                root.style.setProperty('--on-secondary-container', secondaryHex);
            }
        };

        const savedPrimary = localStorage.getItem('lazplay-theme-color') || '#39ff14';
        const savedSecondary = localStorage.getItem('lazplay-secondary-color') || '#ffabf3';
        
        updateThemeColors(savedPrimary, savedSecondary);

        window.setThemeColor = (color) => {
            localStorage.setItem('lazplay-theme-color', color);
            updateThemeColors(color, null);
        };

        window.setSecondaryColor = (color) => {
            localStorage.setItem('lazplay-secondary-color', color);
            updateThemeColors(null, color);
        };
    </script>
    <style>
        .scanlines {
            background: linear-gradient(to bottom,
                    rgba(255, 255, 255, 0),
                    rgba(255, 255, 255, 0) 50%,
                    rgba(0, 0, 0, 0.2) 50%,
                    rgba(0, 0, 0, 0.2));
            background-size: 100% 4px;
            pointer-events: none;
        }

        .retro-border {
            box-shadow: -2px -2px 0 0 var(--on-primary-container), 2px 2px 0 0 #131313;
        }

        .retro-border-hover:hover {
            box-shadow: -2px -2px 0 0 var(--primary-container), 2px 2px 0 0 var(--on-primary-container);
        }

        .neon-glow {
            box-shadow: 0 0 10px var(--primary-container);
        }

        /* Autofill Override to prevent white background */
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #131313 inset !important;
            -webkit-text-fill-color: #e5e2e1 !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>

<body
    class="bg-background text-on-background font-body-md min-h-screen relative overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
